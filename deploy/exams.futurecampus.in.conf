# Apache2 site for exams.futurecampus.in on PHP 8.3 (same PHP as the other sites on this VPS).
# Install: sudo cp to /etc/apache2/sites-available/ && sudo a2ensite exams.futurecampus.in
# HTTPS:   sudo certbot --apache -d exams.futurecampus.in  (creates the :443 copy of this block)
<VirtualHost *:80>
    ServerName exams.futurecampus.in
    DocumentRoot /var/www/html/exams

    <Directory /var/www/html/exams>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    # If Apache runs PHP as a module (`apache2ctl -M` lists php_module), nothing else is needed.
    # If the other sites use PHP-FPM instead, uncomment this block:
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    # Per-site PHP limits (mod_php only; same values as docker/php/php.ini)
    <IfModule php_module>
        php_admin_value date.timezone Asia/Kolkata
        php_admin_value memory_limit 512M
        php_admin_value upload_max_filesize 64M
        php_admin_value post_max_size 64M
        php_admin_value max_execution_time 300
        php_admin_value max_input_vars 5000
    </IfModule>

    # Never serve local-dev files
    <LocationMatch "^/(docker|deploy|\.git)(/|$)|^/(docker-compose\.yml|DOCKER\.md|DEPLOY\.md)$">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/exams_error.log
    CustomLog ${APACHE_LOG_DIR}/exams_access.log combined
</VirtualHost>
